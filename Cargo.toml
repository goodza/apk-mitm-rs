[package]
name = "apk-mitm"
version = "1.4.0"
edition = "2021"
description = "A CLI application that automatically prepares Android APK files for HTTPS inspection"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
regex = "1"
reqwest = { version = "0.12", features = ["blocking", "rustls-tls"], default-features = false }
tempfile = "3"
walkdir = "2"

[dev-dependencies]
assert_fs = "1"
