name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package Unix binary
        if: runner.os != 'Windows'
        id: package-unix
        shell: bash
        run: |
          archive="apk-mitm-${{ inputs.tag }}-${{ matrix.target }}.tar.gz"
          mkdir dist
          cp "target/${{ matrix.target }}/release/apk-mitm" README.md LICENSE dist/
          tar -C dist -czf "$archive" .
          shasum -a 256 "$archive" > "$archive.sha256"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        id: package-windows
        shell: pwsh
        run: |
          $archive = "apk-mitm-${{ inputs.tag }}-${{ matrix.target }}.zip"
          New-Item -ItemType Directory -Path dist | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/apk-mitm.exe", README.md, LICENSE -Destination dist
          Compress-Archive -Path dist/* -DestinationPath $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLower()
          "$hash  $archive" | Set-Content "$archive.sha256"
          "archive=$archive" >> $env:GITHUB_OUTPUT

      - name: Upload Unix release assets
        if: runner.os != 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" \
            "${{ steps.package-unix.outputs.archive }}" \
            "${{ steps.package-unix.outputs.archive }}.sha256" \
            --clobber

      - name: Upload Windows release assets
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.tag }}" `
            "${{ steps.package-windows.outputs.archive }}" `
            "${{ steps.package-windows.outputs.archive }}.sha256" `
            --clobber
